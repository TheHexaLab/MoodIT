# Compose de PRODUCTION pour un VPS unique (Hetzner ~8 €/mois, x86 : les images runner ne se
# construisent pas sur ARM, cf. deploy/DEPLOY.md).
# Dérivé de docker-compose-prod.yml, avec 2 différences :
#   1. Ollama SUPPRIMÉ  → mcp-service pointe sur Groq : choix de la prod pour son coût (voir #33).
#   2. Caddy AJOUTÉ     → seul conteneur exposé sur Internet (HTTPS auto Let's Encrypt).
# Le frontend (nginx) reste le reverse-proxy applicatif interne (/api, /mcp, /ws → gateway).
#
# Lancer depuis la RACINE du repo (c'est ce que fait deploy/update.sh, qui tague en plus les
# images runner par commit — cf. deploy/DEPLOY.md, « 5. Démarrer » et « Mettre à jour la prod ») :
#   ./docker/runners/build.sh
#   docker compose --env-file .env.docker -f docker-compose-hetzner.yml up -d --build
#
# Pré-requis : un fichier .env.docker à la racine (cf. deploy/env.docker.example).

services:
  # ── Reverse-proxy public + TLS automatique ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: moodit_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - frontend

  postgres:
    image: postgres:16
    container_name: moodit_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      TZ: America/Toronto
      PGTZ: America/Toronto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - internal

  # ── Migrations du schéma (Flyway, #96) : one-shot, avant les services qui utilisent la base ──
  # Applique db/migration (schéma + données de référence, jamais les données de démo). Une base déjà
  # peuplée sans historique Flyway (la prod au passage à Flyway) est marquée à la version 2 sans rien
  # rejouer (baseline) ; ensuite, seules les nouvelles versions s'appliquent. Les identifiants
  # viennent de .env.docker, lus dans le conteneur (rien n'est interpolé dans ce fichier).
  db-migrate:
    image: flyway/flyway:13.10.0@sha256:f5dab54b2b51e5aa131ebc2be36fd8a7c18006541db06638469ec26b6ad2bfe2
    container_name: moodit_db_migrate
    restart: "no"
    env_file:
      - .env.docker
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/db/migration
      # Les gabarits de code des langages contiennent des ${…} (JavaScript) : pas de variables Flyway.
      FLYWAY_PLACEHOLDER_REPLACEMENT: "false"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "2"
      FLYWAY_CONNECT_RETRIES: "10"
    entrypoint: ["sh", "-c"]
    command:
      - exec flyway -url="jdbc:postgresql://postgres:5432/$$POSTGRES_DB" -user="$$POSTGRES_USER" -password="$$POSTGRES_PASSWORD" migrate
    volumes:
      - ./db:/flyway/db:ro
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Frontend : plus de port publié, Caddy l'atteint via le réseau interne ──
  frontend:
    build: ./frontend
    container_name: moodit_frontend
    restart: unless-stopped
    env_file:
      - .env.docker
    expose:
      - "5173"
    mem_limit: 128m
    networks:
      - internal
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    container_name: moodit_gateway
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    expose:
      - "${GATEWAY_PORT}"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      - core-service
      - auth-service
      - permission-service
      - mcp-service

  core-service:
    build: ./core-service
    container_name: moodit_core
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Même mise en garde que dans le bloc d'execution-service, dans l'autre sens :
      # EXEC_INTERNAL_QUEUE_WAIT_MS et EXEC_INTERPRETED_BUDGET_MS sont PARTAGÉES entre les deux
      # services et vont dans .env.docker (cf. deploy/env.docker.example). Posées ici, core attendrait une
      # autre valeur que le serveur et abandonnerait des corrections encore en cours (#216).
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      # Corrections de quiz à harnais menées en parallèle par core : à garder ÉGAL à
      # EXEC_MAX_CONCURRENT − 1 du bloc execution-service (3 − 1 = 2), le nombre de places
      # qu'execution-service accorde aux corrections. Plus de fils attendraient une place
      # sans jamais l'obtenir avant leur abandon. Les modifier ensemble.
      QUIZ_CODE_GRADING_THREADS: "2"
    mem_limit: 640m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      # Reprise des corrections pending au démarrage : execution-service doit répondre, sinon
      # chaque tentative reprise est supprimée (cf. le healthcheck d'execution-service).
      execution-service:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: moodit_auth
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  permission-service:
    build: ./permission-service
    container_name: moodit_permission
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ── MCP : LLM = Groq, choix de la PROD pour son coût (#33) ─────────────────
  # Partout ailleurs, le défaut est un modèle LOCAL (Ollama, cf. mcp-service et
  # docker-compose-prod.yml) : aucune donnée du forum ne sort vers un tiers. Le VPS (8 Go) ne
  # peut pas faire tourner un modèle 7B à côté du reste ; Groq est gratuit, mais les extraits du
  # forum (anonymisés) partent alors chez lui. Pour un autre modèle (hébergé par l'équipe…),
  # définir LLM_BASE_URL et LLM_MODEL dans .env.docker : ils remplacent ces défauts, sans toucher
  # au dépôt (update.sh lance compose avec --env-file .env.docker).
  # LLM_API_KEY (gsk_...) vient de .env.docker. Clé absente / appel KO → repli
  # déterministe (l'analyse aboutit quand même à partir des vraies stats).
  mcp-service:
    build: ./mcp-service
    container_name: moodit_mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      CORE_SERVICE_HOST: core-service
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_MS: "60000"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  execution-service:
    build: ./execution-service
    container_name: moodit_execution
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      # 3 exécutions simultanées au plus : borne le nombre de CONTENEURS RUNNER simultanés
      # (#116), soit 3 × SANDBOX_MEMORY_MB en POINTE (plafond, pas une réservation) —
      # surveiller la RAM du VPS avant de l'augmenter. Chaque côté (corrections internes,
      # « Exécuter »/« Tester » publics) a au plus DEUX places (EXEC_MAX_CONCURRENT − 1) : il
      # en reste toujours une à l'autre. Les « Tester » n'affament pas les corrections, et une
      # file de corrections (fin d'examen) ne refuse pas tous les « Exécuter ». La garantie
      # porte sur UNE place : si deux « Tester » longs tiennent les deux places publiques, la
      # seconde correction simultanée attend EXEC_INTERNAL_QUEUE_WAIT_MS, puis est refusée
      # (tentative supprimée, l'étudiant resoumet — sauf relance de l'enseignant, ou plafond
      # d'échecs atteint sur un quiz sans reprise : gardée « à revoir »).
      # ATTENTION — ne pas ajouter ici EXEC_INTERNAL_QUEUE_WAIT_MS ni EXEC_INTERPRETED_BUDGET_MS :
      # ces deux-là sont lus AUSSI par core-service (son délai de lecture de la correction, #216).
      # Posées dans ce bloc, elles ne vaudraient que pour execution-service, et core abandonnerait
      # des corrections encore en cours — tentatives d'étudiants supprimées. Elles vont dans le
      # .env.docker commun (cf. deploy/env.docker.example), que les deux services chargent par env_file.
      # QUIZ_CODE_GRADING_THREADS du bloc core-service doit valoir EXEC_MAX_CONCURRENT − 1.
      EXEC_MAX_CONCURRENT: "3"
      # Un appel public tient maintenant un conteneur entier (quelques secondes pour un
      # interprété) au lieu d'une requête HTTP sous-seconde : l'attente d'une place suit.
      EXEC_QUEUE_WAIT_MS: "15000"
      # Requêtes en vol par utilisateur. DOIT rester STRICTEMENT sous le nombre de places
      # publiques (EXEC_MAX_CONCURRENT − 1, soit 2 ici) : à égalité, un seul compte peut les
      # occuper toutes et refuser « Exécuter »/« Tester » à toute l'instance — un appel public
      # tient un conteneur entier (jusqu'à ~60 s de compilation pour un langage compilé).
      EXEC_MAX_PER_USER: "1"
      # Conteneurs runner (#116) : 1 vCPU et 1 Go chacun sur ce VPS — deux notations
      # simultanées ne doivent pas monopoliser la machine (Caddy, Postgres, services Java)
      # pendant plusieurs minutes. Les valeurs par défaut (2 vCPU, 1,5 Go) visent le dev.
      SANDBOX_CPUS: "1.0"
      SANDBOX_MEMORY_MB: "1024"
      # Images runner du MEME commit que ce service (posé par deploy/update.sh, cf.
      # docker/runners/build.sh) ; `latest` si la variable manque (compose lancé à la main).
      SANDBOX_IMAGE_TAG: "${MOODIT_RUNNER_TAG:-latest}"
    mem_limit: 512m
    volumes:
      # Runner Docker de TOUTE exécution (#116 : compilés, interprétés, SQL, vues, « Exécuter ») :
      # conteneurs jetables moodit-runner-* via le démon
      # Docker de l'HÔTE (docker-outside-of-docker). Accès ROOT-ÉQUIVALENT à l'hôte : ce service
      # est joignable depuis Internet (/exec/** via le gateway), un défaut d'exécution de code y
      # vaudrait donc l'hôte entier. Assumé en attendant son durcissement (#271) ; cf.
      # deploy/DEPLOY.md. Images construites au déploiement par docker/runners/build.sh.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    # Port ouvert = contexte Spring démarré. Sert au depends_on de core-service : la reprise des
    # corrections "pending" au démarrage de core (QuizGradingListener) appelle ce service, et
    # une correction qui le trouve injoignable SUPPRIME la tentative. Bash /dev/tcp : l'image
    # JRE n'a ni curl ni wget.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${EXEC_SERVICE_PORT:-8085}'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
