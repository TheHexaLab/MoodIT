# Compose de PRODUCTION pour un VPS unique (Hetzner ~8 €/mois, ARM ou x86).
# Dérivé de docker-compose-prod.yml, avec 2 différences :
#   1. Ollama SUPPRIMÉ  → mcp-service pointe sur Groq : choix de la prod pour son coût (voir #33).
#   2. Caddy AJOUTÉ     → seul conteneur exposé sur Internet (HTTPS auto Let's Encrypt).
# Le frontend (nginx) reste le reverse-proxy applicatif interne (/api, /mcp, /ws → gateway).
#
# Lancer depuis la RACINE du repo :
#   docker compose -f deploy/docker-compose-hetzner.yml up -d --build
#
# Pré-requis : un fichier .env.docker à la racine (cf. deploy/.env.docker.example).

services:
  # ── Reverse-proxy public + TLS automatique ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: moodit_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - frontend

  postgres:
    image: postgres:16
    container_name: moodit_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      TZ: America/Toronto
      PGTZ: America/Toronto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - internal

  # ── Migrations du schéma (Flyway, #96) : one-shot, avant les services qui utilisent la base ──
  # Applique db/migration (schéma + données de référence, jamais les données de démo). Une base déjà
  # peuplée sans historique Flyway (la prod au passage à Flyway) est marquée à la version 2 sans rien
  # rejouer (baseline) ; ensuite, seules les nouvelles versions s'appliquent. Les identifiants
  # viennent de .env.docker, lus dans le conteneur (rien n'est interpolé dans ce fichier).
  db-migrate:
    image: flyway/flyway:13.10.0@sha256:f5dab54b2b51e5aa131ebc2be36fd8a7c18006541db06638469ec26b6ad2bfe2
    container_name: moodit_db_migrate
    restart: "no"
    env_file:
      - .env.docker
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/db/migration
      # Les gabarits de code des langages contiennent des ${…} (JavaScript) : pas de variables Flyway.
      FLYWAY_PLACEHOLDER_REPLACEMENT: "false"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "2"
      FLYWAY_CONNECT_RETRIES: "10"
    entrypoint: ["sh", "-c"]
    command:
      - exec flyway -url="jdbc:postgresql://postgres:5432/$$POSTGRES_DB" -user="$$POSTGRES_USER" -password="$$POSTGRES_PASSWORD" migrate
    volumes:
      - ./db:/flyway/db:ro
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Frontend : plus de port publié, Caddy l'atteint via le réseau interne ──
  frontend:
    build: ./frontend
    container_name: moodit_frontend
    restart: unless-stopped
    env_file:
      - .env.docker
    expose:
      - "5173"
    mem_limit: 128m
    networks:
      - internal
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    container_name: moodit_gateway
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    expose:
      - "${GATEWAY_PORT}"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      - core-service
      - auth-service
      - permission-service
      - mcp-service

  core-service:
    build: ./core-service
    container_name: moodit_core
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
    mem_limit: 640m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  auth-service:
    build: ./auth-service
    container_name: moodit_auth
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  permission-service:
    build: ./permission-service
    container_name: moodit_permission
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ── MCP : LLM = Groq, choix de la PROD pour son coût (#33) ─────────────────
  # Partout ailleurs, le défaut est un modèle LOCAL (Ollama, cf. mcp-service et
  # docker-compose-prod.yml) : aucune donnée du forum ne sort vers un tiers. Le VPS (8 Go) ne
  # peut pas faire tourner un modèle 7B à côté du reste ; Groq est gratuit, mais les extraits du
  # forum (anonymisés) partent alors chez lui. Pour un autre modèle (hébergé par l'équipe…),
  # définir LLM_BASE_URL et LLM_MODEL dans .env.docker : ils remplacent ces défauts, sans toucher
  # au dépôt (update.sh lance compose avec --env-file .env.docker).
  # LLM_API_KEY (gsk_...) vient de .env.docker. Clé absente / appel KO → repli
  # déterministe (l'analyse aboutit quand même à partir des vraies stats).
  mcp-service:
    build: ./mcp-service
    container_name: moodit_mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      CORE_SERVICE_HOST: core-service
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_MS: "60000"
    mem_limit: 512m
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  execution-service:
    build: ./execution-service
    container_name: moodit_execution
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      # 2 exécutions simultanées au plus : borne le nombre de CONTENEURS RUNNER simultanés (#116),
      # soit 2 × 1,5 Go en pointe — surveiller la RAM du VPS avant de l'augmenter.
      EXEC_MAX_CONCURRENT: "2"
    mem_limit: 512m
    volumes:
      # Runner des langages COMPILÉS (#116) : conteneurs jetables moodit-runner-* via le démon
      # Docker de l'HÔTE (docker-outside-of-docker). Accès root-équivalent au démon : assumé,
      # service interne sans route d'admin ; cf. deploy/DEPLOY.md. Images construites au déploiement
      # par docker/runners/build.sh.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
