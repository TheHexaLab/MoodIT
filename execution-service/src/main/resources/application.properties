spring.application.name=execution-service
spring.config.import=optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
# Le gateway route /exec/** → execution-service (sans stripping) : contrôleurs sous /exec.
# Défaut 8085 (et non 8084) pour ne pas entrer en collision avec le permission-service.
server.port=${EXEC_SERVICE_PORT:8085}

app.exec.max-concurrent=${EXEC_MAX_CONCURRENT:4}
app.exec.queue-wait-ms=${EXEC_QUEUE_WAIT_MS:5000}
# Correction interne des soumissions : attente plus longue (un refus fait échouer la tentative).
# Elle vaut PAR APPEL au sandbox (un par harnais, deux pour un harnais SQL de modification), et
app.exec.internal-queue-wait-ms=${EXEC_INTERNAL_QUEUE_WAIT_MS:15000}
# Requêtes « Tester » / « play » en cours par utilisateur (X-User-Email) ; la suivante → 429 immédiat.
# La correction interne des soumissions (core-service) n'est soumise qu'à la limite globale.
app.exec.max-per-user=${EXEC_MAX_PER_USER:2}

# ── SQL (questions de modification, exécution isolée en 2 phases) ─────────────
# Taille max (caractères) du dump d'état transféré phase 1 → phase 2 (borne anti-DoS).
app.sql.max-dump-chars=${SQL_MAX_DUMP_CHARS:524288}

# ── Runner Docker des langages compilés (#116) ────────────────────────────────
# Les questions Go/Rust/C/C++/C#/Java sont notées dans un conteneur jetable moodit-runner-*
# (cf. docker/runners/README.md). docker-host vide = auto : socket Unix (conteneur/Linux) ou
# named pipe (dev Windows). Limites PAR CONTENEUR ; la mémoire couvre compilation + exécution.
app.sandbox.docker-host=${SANDBOX_DOCKER_HOST:}
app.sandbox.image-prefix=${SANDBOX_IMAGE_PREFIX:moodit-runner-}
app.sandbox.image-tag=${SANDBOX_IMAGE_TAG:latest}
app.sandbox.memory-mb=${SANDBOX_MEMORY_MB:1536}
app.sandbox.pids-limit=${SANDBOX_PIDS_LIMIT:512}
app.sandbox.cpus=${SANDBOX_CPUS:2.0}

# ── Appel interne (core-service → correction des soumissions) ─────────────────
# Endpoint /internal/exec/** authentifié par un jeton partagé (identique côté core), non
# exposé par le gateway. Défense en profondeur pour l'appel service-à-service.
# Secret SANS valeur de repli, quel que soit le profil (#31) : si la variable manque, le
# démarrage échoue au lieu de tourner avec une valeur publique. En local, la définir dans .env.
app.internal.token=${INTERNAL_TOKEN}

# ── Logs ──────────────────────────────────────────────────────────────────────
%dev.logging.level.com.moodit.execution_service=DEBUG
%prod.logging.level.com.moodit.execution_service=INFO
logging.level.org.springframework.security=WARN
