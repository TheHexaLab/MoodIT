spring.application.name=execution-service
spring.config.import=optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
# Le gateway route /exec/** → execution-service (sans stripping) : contrôleurs sous /exec.
# Défaut 8085 (et non 8084) pour ne pas entrer en collision avec le permission-service.
server.port=${EXEC_SERVICE_PORT:8085}

# ── Piston (sandbox d'exécution du code non fiable) ───────────────────────────
# API v2 de Piston sur le réseau interne. On lui envoie fichiers + limites, il renvoie
# stdout/stderr/exit code par exécution. run_timeout ≤ 3000 ms (défaut Piston).
app.piston.base-url=${PISTON_URL:http://localhost:2000}
app.piston.run-timeout-ms=${PISTON_RUN_TIMEOUT_MS:3000}
app.piston.compile-timeout-ms=${PISTON_COMPILE_TIMEOUT_MS:10000}
# Délai HTTP max côté client (doit couvrir compile + run + marge). Repris par core-service dans
# son délai de lecture de la correction (cf. internal-queue-wait-ms plus bas).
app.piston.http-timeout-ms=${PISTON_HTTP_TIMEOUT_MS:20000}
# Mémoire max par exécution (octets), envoyée à chaque appel (#24) : sans elle, Piston n'applique
# aucune limite et une boucle d'allocation épuise la mémoire du conteneur. ≤ 0 = non envoyée.
# La compilation (rustc, javac, mono, go) a besoin de plus que l'exécution.
app.piston.run-memory-limit-bytes=${PISTON_RUN_MEMORY_LIMIT_BYTES:256000000}
app.piston.compile-memory-limit-bytes=${PISTON_COMPILE_MEMORY_LIMIT_BYTES:512000000}

# ── Bornes de charge (#24) ────────────────────────────────────────────────────
# Exécutions Piston simultanées, tous appelants confondus. Une exécution en trop attend une place
# au plus queue-wait-ms, puis la requête reçoit un 429. Garder max-concurrent × mémoire compile
# sous la mémoire du conteneur Piston (mem_limit de docker-compose-hetzner.yml).
app.exec.max-concurrent=${EXEC_MAX_CONCURRENT:4}
app.exec.queue-wait-ms=${EXEC_QUEUE_WAIT_MS:5000}
# Correction interne des soumissions : attente plus longue (un refus fait échouer la tentative).
# Elle vaut PAR APPEL au sandbox (un par harnais, deux pour un harnais SQL de modification), et
# core-service l'ajoute au délai Piston (PISTON_HTTP_TIMEOUT_MS) dans son délai de lecture de la
# correction (ExecutionClient, #216), en lisant les mêmes variables. Augmenter l'une d'elles pour
# execution-service seulement ferait abandonner par core-service des corrections encore en cours.
app.exec.internal-queue-wait-ms=${EXEC_INTERNAL_QUEUE_WAIT_MS:15000}
# Requêtes « Tester » / « play » en cours par utilisateur (X-User-Email) ; la suivante → 429 immédiat.
# La correction interne des soumissions (core-service) n'est soumise qu'à la limite globale.
app.exec.max-per-user=${EXEC_MAX_PER_USER:2}

# ── SQL (questions de modification, exécution isolée en 2 phases) ─────────────
# Taille max (caractères) du dump d'état transféré phase 1 → phase 2 (borne anti-DoS).
app.sql.max-dump-chars=${SQL_MAX_DUMP_CHARS:524288}

# ── Appel interne (core-service → correction des soumissions) ─────────────────
# Endpoint /internal/exec/** authentifié par un jeton partagé (identique côté core), non
# exposé par le gateway. Défense en profondeur pour l'appel service-à-service.
# Secret SANS valeur de repli, quel que soit le profil (#31) : si la variable manque, le
# démarrage échoue au lieu de tourner avec une valeur publique. En local, la définir dans .env.
app.internal.token=${INTERNAL_TOKEN}

# ── Logs ──────────────────────────────────────────────────────────────────────
%dev.logging.level.com.moodit.execution_service=DEBUG
%prod.logging.level.com.moodit.execution_service=INFO
logging.level.org.springframework.security=WARN
