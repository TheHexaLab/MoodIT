spring.application.name=core-service
# Préfixe /api des routes REST : appliqué par WebMvcConfig (addPathPrefix), PAS par
# spring.mvc.servlet.path — sinon l'endpoint WebSocket (/ws) passerait aussi sous /api.
# Le DispatcherServlet reste à la racine.
spring.config.import=optional:file:../.env[.properties]
# Profil actif repris de SPRING_PROFILES_ACTIVE (.env importé ou vraie variable d'env).
# En import de properties, la forme MAJUSCULE n'active pas le profil toute seule (seule
# une vraie variable d'environnement le ferait) : on la relaie donc via ce placeholder.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
# ── Serveur ───────────────────────────────────────────────────────────────────
server.port=${CORE_SERVICE_PORT:8081}
# ── Base de données ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:moodit_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Schéma géré par les migrations Flyway (db/migration). `ddl-auto` volontairement NON défini ici : défaut
# Spring Boot = `none` sur Postgres, `create-drop` sur H2 (requis par les tests @DataJpaTest).
# En prod, `validate` est posé dans application-prod.properties (les anciens préfixes
# %dev./%prod. étaient une syntaxe Quarkus que Spring ignore, cf. issue #27).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret SANS valeur de repli, quel que soit le profil (#31) : si la variable manque, le
# démarrage échoue au lieu de tourner avec une valeur publique. En local, la définir dans .env.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# ── Permission service ────────────────────────────────────────────────────────
# URL interne du permission-service : autorisation des rooms WebSocket au `join`
# (RemoteRoomAuthorizer -> POST /permissions/can-join).
app.permission-service.url=http://${PERMISSION_SERVICE_HOST:localhost}:${PERMISSION_SERVICE_PORT:8084}
# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://${GATEWAY_HOST:localhost}:${GATEWAY_PORT:8080}
# ── Pont WebSocket interne (appelé par mcp-service) ───────────────────────────
# L'analyse MCP vit désormais dans mcp-service ; il pousse ses résultats via
# /internal/realtime/mcp/** (relayé vers RealtimeEventPublisher). Ce jeton partagé
# authentifie ces appels internes (doit être identique côté mcp-service).
# Secret SANS valeur de repli, quel que soit le profil (#31) : si la variable manque, le
# démarrage échoue au lieu de tourner avec une valeur publique. En local, la définir dans .env.
app.internal.token=${INTERNAL_TOKEN}
# Service d'exécution du code (conteneurs runner Docker, #116) : correction async des questions Code, appelé sur
# son endpoint INTERNE (jeton partagé ci-dessus). Non exposé par le gateway.
app.execution-service.internal-url=http://${EXEC_SERVICE_HOST:localhost}:${EXEC_SERVICE_PORT:8085}
# Délai de lecture de la correction (ExecutionClient, #216), modélisé sur le pire cas du runner :
# read-timeout-ms (10 s) + par unité interprétée [attente de file + max(per-test-timeout-ms,
# temps limite + 5 s) + 75 s de mur + cycle de vie du conteneur hors mur], plafonné par le budget
# global du serveur (EXEC_INTERPRETED_BUDGET_MS, 15 min) plus le harnais déjà parti quand
# l'échéance tombe ; ou, pour un job compilé, une attente de file + le miroir du mur de
# DockerEvaluator, plafonné par CE mur (15 min, indépendant de EXEC_INTERPRETED_BUDGET_MS) + UNE
# fois le cycle de vie. Ce cycle de vie (485 s au pire, démon lent) suit les bornes d'appel au
# démon d'execution-service (DockerSandbox : RESPONSE_TIMEOUT, CONNECTION_TIMEOUT, logReadTimeout)
# et n'est pas réglable ici. Détail : javadoc de ExecutionClient#readTimeoutMs.
# internal-queue-wait-ms (EXEC_INTERNAL_QUEUE_WAIT_MS, 120 s) et interpreted-budget-ms
# (EXEC_INTERPRETED_BUDGET_MS, 15 min) sont partagées avec execution-service via le .env commun :
# les deux services lisent la MÊME variable, donc les valeurs ne peuvent plus diverger par oubli
# (un miroir plus court que le budget réel abandonnerait une correction en cours). per-test-timeout-ms est un
# réglage de core seul (son homologue serveur a disparu avec Piston).
# Pool de correction des quiz À HARNAIS (AsyncConfig.quizCodeExecutor, #116) : une correction tient
# une place d'execution-service pendant tout son conteneur runner. Aligner code-threads sur
# EXEC_MAX_CONCURRENT − 1 (places accordées aux corrections ; défaut 4 − 1 = 3) : moins laisse des
# places vides, plus fait attendre des corrections dans la file d'execution-service jusqu'à leur
# abandon. La file borne les corrections en attente ; une soumission refusée au-delà est
# supprimée et l'étudiant prévenu (sauf relance de l'enseignant, ou plafond d'échecs atteint sur un quiz sans reprise, gardée « à revoir », cf. QuizService#failGrading). Les quiz sans harnais ont leur
# propre pool et n'attendent jamais derrière celui-ci.
app.quiz.grading.code-threads=${QUIZ_CODE_GRADING_THREADS:3}
# execution-service INJOIGNABLE (il redémarre, ou core a démarré avant lui) : la correction retente
# la connexion pendant cette durée avant d'être abandonnée (tentative supprimée, sauf relance de l'enseignant, ou plafond d'échecs atteint sur un quiz sans reprise, gardée « à revoir », cf. QuizService#failGrading).
# Sans cela, un
# redémarrage d'execution-service vidait la file de corrections en quelques secondes. 0 = aucun
# nouvel essai. Seul un échec de CONNEXION est retenté, jamais une correction déjà partie.
app.execution-service.unreachable-retry-ms=${EXEC_UNREACHABLE_RETRY_MS:120000}
app.quiz.grading.code-queue-capacity=${QUIZ_CODE_GRADING_QUEUE:500}
# Plafond des échecs de correction SANS VERDICT (conteneur runner mort, superviseur muet) par
# étudiant et par quiz (#116, S4). En deçà, la tentative échouée est supprimée et l'étudiant
# resoumet ; à partir de ce compte, elle est gardée « à revoir » par l'enseignant. Au moins 1
# (vérifié au démarrage) : 0 ne désactive pas le plafond, il le rendrait toujours atteint.
app.quiz.grading.max-no-verdict-failures=${QUIZ_MAX_NO_VERDICT_FAILURES:3}
# ── Logs ──────────────────────────────────────────────────────────────────────
%dev.logging.level.com.moodit.core_service=DEBUG
%prod.logging.level.com.moodit.core_service=INFO
logging.level.org.springframework.security=WARN
logging.level.com.moodit.core_service=DEBUG