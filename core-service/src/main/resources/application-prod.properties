# Surcharges actives sous le profil prod (SPRING_PROFILES_ACTIVE=prod).
#
# Jeton interne SANS valeur de repli : si INTERNAL_TOKEN manque, le démarrage ÉCHOUE
# (placeholder non résolu) plutôt que de laisser le validateur des endpoints /internal
# se DÉSACTIVER (jeton vide → contrôle off). Fail-fast voulu, cohérent avec
# JWT_SECRET / pepper. Doit être identique au jeton configuré côté mcp-service.
app.internal.token=${INTERNAL_TOKEN}

# Secrets LiveKit SANS valeur de repli : si la feature vocale est activee en prod
# (VOICE_ENABLED=true) sans cles fournies, le demarrage ECHOUE au lieu de signer des
# JoinToken avec un secret de dev connu. Cohérent avec JWT_SECRET / INTERNAL_TOKEN.
# Si le vocal est OFF, ces placeholders ne sont jamais resolus (bean conditionnel) : OK.
moodit.voice.livekit.url=${LIVEKIT_URL}
moodit.voice.livekit.api-key=${LIVEKIT_API_KEY}
moodit.voice.livekit.api-secret=${LIVEKIT_API_SECRET}

logging.level.com.moodit.core_service=INFO
