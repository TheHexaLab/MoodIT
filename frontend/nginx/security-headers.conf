# En-têtes de sécurité HTTP du frontend (#93), copiés dans l'image par frontend/Dockerfile vers
# /etc/nginx/security-headers.conf et inclus au niveau `server` de default.conf.
#
# PIÈGE nginx : par défaut, un `add_header` dans un `location` annule TOUS les `add_header` hérités
# du niveau `server`. default.conf pose donc `add_header_inherit merge;` à côté de l'include : un
# `location` qui ajoute ses propres en-têtes (ex. Cache-Control sur /assets/) garde aussi ceux-ci.
# Ne pas refaire l'include dans un `location` : avec `merge`, les en-têtes seraient envoyés en double.
# Le test e2e security-headers.spec.ts vérifie les en-têtes sur la page, sur un fichier de /assets/
# et sur une réponse de l'API.
#
# `always` : les en-têtes partent aussi sur les réponses d'erreur (404, 5xx…), pas seulement 2xx/3xx.
#
# HSTS n'est PAS ici : nginx ne parle qu'en HTTP derrière le reverse-proxy. C'est Caddy, qui termine
# TLS, qui l'envoie (deploy/Caddyfile).

# Les services Spring (Spring Security) posent déjà certains de ces en-têtes sur leurs réponses :
# nginx les retire de la réponse amont pour que chaque en-tête n'apparaisse qu'une fois, avec la
# valeur ci-dessous. Sans effet sur les statiques (pas de réponse amont).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;

# Anti-clickjacking pour les navigateurs anciens ; frame-ancestors 'none' de la CSP pour les autres.
# Tant que la CSP est en Report-Only, frame-ancestors ne fait que signaler : c'est cet en-tête qui
# bloque réellement la mise en <iframe>.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Micro et caméra : le vocal en a besoin, pour l'origine elle-même seulement. Le reste est coupé.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), screen-wake-lock=(), xr-spatial-tracking=(), browsing-topics=()" always;

# CSP en Report-Only : les violations sont signalées (console du navigateur), rien n'est bloqué.
# À passer en `Content-Security-Policy` une fois validée (voir la PR #93).
#  - script-src : 'self' + hash du script inline de bootstrap du thème dans index.html (pas de
#    'unsafe-inline' JS). Si ce script change, recalculer le hash ; le test Vitest
#    src/securityHeaders.test.ts échoue tant qu'il ne correspond pas (ici et dans deploy/Caddyfile).
#  - style-src-elem 'self' : seules les feuilles CSS du build (app + katex.min.css), aucune balise
#    <style> inline. style-src-attr 'unsafe-inline' : attributs style="…" produits par KaTeX
#    (valeurs dynamiques, ni hash ni nonce possibles) et par les pages statiques de public/.
#    style-src 'self' 'unsafe-inline' : repli des navigateurs sans style-src-elem/-attr.
#  - img-src data: blob: : favicons, icônes en data: du build, aperçu local d'une photo de profil.
#  - font-src data: : polices KaTeX, dont les plus petites peuvent être inlinées par Vite.
#  - connect-src 'self' : API et WebSocket /ws sur la même origine (ws:/wss: compris).
#    Vocal (LiveKit, pas encore sur main) : ajouter l'origine du SFU en https ET wss, par ex.
#    `https://livekit.moodit.ca wss://livekit.moodit.ca` ; le TURN passe par ICE, hors CSP.
#  - worker-src 'self' : worker E2EE de LiveKit, servi depuis /assets/ (ajouter blob: seulement
#    s'il est un jour créé à partir d'un Blob).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-jiVY1wMx7/ZirDhELvxOE4hml8jraFv+QvVD/aAicy4='; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
