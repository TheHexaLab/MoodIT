services:
  postgres:
    image: postgres:16
    container_name: moodit_postgres
    env_file:
      - .env.docker
    environment:
      TZ: America/Toronto
      PGTZ: America/Toronto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Migrations du schéma (Flyway, #96) : one-shot, avant les services qui utilisent la base ──
  # Applique db/migration (schéma + données de référence, jamais les données de démo). Une base déjà
  # peuplée sans historique Flyway (la prod au passage à Flyway) est marquée à la version 2 sans rien
  # rejouer (baseline) ; ensuite, seules les nouvelles versions s'appliquent. Les identifiants
  # viennent de .env.docker, lus dans le conteneur (rien n'est interpolé dans ce fichier).
  db-migrate:
    image: flyway/flyway:13.10.0@sha256:f5dab54b2b51e5aa131ebc2be36fd8a7c18006541db06638469ec26b6ad2bfe2
    container_name: moodit_db_migrate
    restart: "no"
    env_file:
      - .env.docker
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/db/migration
      # Les gabarits de code des langages contiennent des ${…} (JavaScript) : pas de variables Flyway.
      FLYWAY_PLACEHOLDER_REPLACEMENT: "false"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "2"
      FLYWAY_CONNECT_RETRIES: "10"
    entrypoint: ["sh", "-c"]
    command:
      - exec flyway -url="jdbc:postgresql://postgres:5432/$$POSTGRES_DB" -user="$$POSTGRES_USER" -password="$$POSTGRES_PASSWORD" migrate
    volumes:
      - ./db:/flyway/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  #Frontend -------------------------------------------------
  frontend:
    build: ./frontend
    container_name: moodit_frontend
    env_file:
      - .env.docker
    ports:
      - "${FRONTEND_PORT}:5173"
    networks:
      - internal
    depends_on:
      - gateway

  #Gateway -------------------------------------------------
  gateway:
    build: ./gateway
    container_name: moodit_gateway
    env_file:
      - .env.docker
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - internal
    depends_on:
      - core-service
      - auth-service
      - permission-service
      - mcp-service

  #Core service -------------------------------------------------
  core-service:
    build: ./core-service
    container_name: moodit_core
    env_file:
      - .env.docker
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  #Auth service -------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: moodit_auth
    env_file:
      - .env.docker
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  #Permission service -------------------------------------------------
  permission-service:
    build: ./permission-service
    container_name: moodit_permission
    env_file:
      - .env.docker
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  #Ollama (LLM local, API compatible OpenAI) --------------------
  # Sert le modèle sur le réseau interne : aucune donnée ne sort vers un tiers.
  ollama:
    image: ollama/ollama:latest
    container_name: moodit_ollama
    volumes:
      - ollama_data:/root/.ollama # modèles persistés : pas de re-téléchargement au redémarrage
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # GPU (NVIDIA) : indispensable pour une latence correcte sur un modèle 7B.
    # Requiert le NVIDIA Container Toolkit (Docker Desktop + WSL2 sous Windows). Si absent,
    # COMMENTER ce bloc « deploy » → repli CPU (beaucoup plus lent, timeout probable au 1er appel).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - internal

  #Ollama-init : tire le modèle au démarrage puis s'arrête (one-shot) ----
  ollama-init:
    image: ollama/ollama:latest
    container_name: moodit_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434 # cible le conteneur ollama, pas soi-même
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b-instruct"]
    restart: "no"
    networks:
      - internal

  #MCP service (analyse de cours via LLM Ollama local) ------------------
  mcp-service:
    build: ./mcp-service
    container_name: moodit_mcp
    env_file:
      - .env.docker
    environment:
      # Le WS vit dans core-service : mcp-service pousse ses résultats via l'endpoint interne.
      CORE_SERVICE_HOST: core-service
      # LLM = conteneur Ollama sur le réseau interne (aucune donnée ne sort vers un tiers).
      # La clé LLM_API_KEY (placeholder "ollama") vient de .env.docker.
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:7b-instruct
      # 1er appel après démarrage : chargement du modèle en VRAM → on élargit le timeout.
      LLM_TIMEOUT_MS: "120000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      # Ne démarre qu'une fois le modèle réellement tiré (sinon 1er appel → 404 model not found).
      ollama-init:
        condition: service_completed_successfully

  #Piston (sandbox d'exécution du code étudiant NON FIABLE) --------------
  # Moteur open-source multi-langages : isolation (isolate/nsjail), pas de réseau à l'exécution,
  # limites CPU/mémoire/temps. Les paquets de langages sont installés dans le volume piston_data
  # (persistés entre redémarrages). Seul sur le réseau `sandbox`, partagé avec execution-service :
  # jamais joignable depuis le gateway, core-service ni aucun autre conteneur.
  piston:
    # Image Piston patchée et épinglée par digest (limite body-parser relevée). cf. piston/Dockerfile
    build: ./piston
    container_name: moodit_piston
    # Pas de `privileged` (#24) : isolate n'a besoin que de créer des espaces de noms (SYS_ADMIN,
    # NET_ADMIN pour la boucle locale de la boîte, SYS_CHROOT) et de gérer ses utilisateurs de boîte
    # (SETUID/SETGID/CHOWN/DAC_OVERRIDE/FOWNER/KILL). Toutes les autres capacités sont retirées et le
    # profil seccomp par défaut de Docker reste actif. AppArmor est levé : le profil docker-default
    # interdit le remontage en écriture de /sys/fs/cgroup (cf. piston/Dockerfile), ce que
    # `privileged` faisait déjà. cgroup privé : la boîte ne voit que l'arbre cgroup du conteneur.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, NET_ADMIN, SYS_CHROOT, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt:
      - apparmor=unconfined
    cgroup: private
    environment:
      # Sortie max par flux (caractères). Le défaut de Piston (1 024) tronque tout extrait SQL de
      # plus de 1 Ko ; il faut au moins app.sql.max-dump-chars (512 Ki) plus la sortie de l'étudiant.
      PISTON_OUTPUT_MAX_SIZE: "1048576"
      # Plafonds mémoire (octets) appliqués aussi quand l'appelant n'en envoie pas (piston-init).
      # execution-service envoie les siens (PISTON_RUN/COMPILE_MEMORY_LIMIT_BYTES), qui ne doivent
      # pas les dépasser : Piston refuserait l'exécution.
      PISTON_RUN_MEMORY_LIMIT: "256000000"
      PISTON_COMPILE_MEMORY_LIMIT: "512000000"
    volumes:
      - piston_data:/piston/packages
    networks:
      - sandbox

  #Piston-init : installe les langages requis puis s'arrête (one-shot, comme ollama-init).
  # Idempotent (paquets persistés dans piston_data). Les PAQUETS installés (à gauche) diffèrent
  # parfois du nom de RUNTIME exposé par Piston (node→javascript, gcc→c/c++, mono→csharp) : on
  # installe par paquet, on vérifie par runtime. Ajouter ici chaque langage supporté par
  # l'assembleur de execution-service.
  piston-init:
    image: curlimages/curl:latest
    container_name: moodit_piston_init
    depends_on:
      - piston
    entrypoint:
      - /bin/sh
      - -c
      - |-
        until curl -fsS http://piston:2000/api/v2/runtimes >/dev/null 2>&1; do
          echo "attente de piston..."; sleep 2;
        done
        for pkg in python:3.12.0 node:20.11.1 typescript:5.0.3 bash:5.2.0 php:8.2.3 \
                   go:1.16.2 rust:1.68.2 gcc:10.2.0 mono:6.12.0 java:15.0.2 sqlite3:3.36.0; do
          lang=$${pkg%%:*}; ver=$${pkg##*:};
          echo "installation $$lang $$ver...";
          curl -sS -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d "{\"language\":\"$$lang\",\"version\":\"$$ver\"}" || true;
        done
        rt=$$(curl -fsS http://piston:2000/api/v2/runtimes);
        for l in python javascript typescript bash php go rust c c++ csharp java sqlite3; do
          echo "$$rt" | grep -qF "\"language\":\"$$l\"" || { echo "echec: runtime $$l absent de piston"; exit 1; };
        done
        # Réchauffage : la toute première exécution d'un langage compilé (JVM, mono, rustc…) lit
        # son paquet à froid et peut dépasser la limite de 3 s d'exécution : une bonne réponse
        # serait alors notée en échec. Une exécution jetable par langage, résultat ignoré.
        for w in 'java|Main.java|public class Main { public static void main(String[] a) {} }' \
                 'csharp|main.cs|class P { static void Main() {} }' \
                 'rust|main.rs|fn main() {}' \
                 'go|main.go|package main\nfunc main() {}' \
                 'c|main.c|int main(void) { return 0; }' \
                 'c++|main.cpp|int main() { return 0; }'; do
          l=$${w%%|*}; rest=$${w#*|}; f=$${rest%%|*}; src=$${rest#*|};
          echo "rechauffage $$l...";
          curl -sS -m 60 -X POST http://piston:2000/api/v2/execute \
            -H 'Content-Type: application/json' \
            -d "{\"language\":\"$$l\",\"version\":\"*\",\"files\":[{\"name\":\"$$f\",\"content\":\"$$src\"}]}" >/dev/null || true;
        done
        echo "piston pret (12 runtimes ; + JSON via node)";
    restart: "no"
    networks:
      - sandbox

  #Execution service (exécute le code étudiant via le sandbox Piston) ----
  execution-service:
    build: ./execution-service
    container_name: moodit_execution
    env_file:
      - .env.docker
    environment:
      PISTON_URL: http://piston:2000 # sandbox, sur le réseau dédié
    networks:
      - internal # appelé par le gateway et core-service
      - sandbox # seul service applicatif qui joint Piston
    depends_on:
      # Ne démarre qu'une fois les langages installés dans Piston.
      piston-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  ollama_data:
  piston_data:

networks:
  internal:
    driver: bridge
  # Réseau du bac à sable (#24) : Piston n'est joignable que par execution-service (et piston-init).
  # Ni le gateway, ni core-service, ni Postgres n'y sont. Pas `internal: true` : Piston télécharge
  # ses paquets de langages (piston-init) ; le code exécuté, lui, n'a aucun réseau (isolate).
  sandbox:
    driver: bridge
