services:
  postgres:
    image: postgres:16
    container_name: moodit_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Toronto
      PGTZ: America/Toronto
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: moodit_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json

  # SFU vocal (greffon retirable) : relaie l'audio WebRTC entre les navigateurs.
  # Retirer la feature = supprimer ce bloc + mettre VOICE_ENABLED=false. Aucun autre
  # service n'en depend au demarrage.
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: moodit_livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      # Format impose par LiveKit : "<cle>: <secret>". Doivent etre identiques aux
      # proprietes moodit.voice.livekit.* du core-service (qui signe les JoinToken).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"       # signalisation WS/HTTP
      - "7881:7881"       # repli ICE/TCP
      - "7882:7882/udp"   # media WebRTC (port UDP mux)
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit/livekit.yaml:ro

volumes:
  postgres_data:
  pgadmin_data:
