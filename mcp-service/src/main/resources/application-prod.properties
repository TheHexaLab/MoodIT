# Surcharges actives sous le profil prod (SPRING_PROFILES_ACTIVE=prod).

# Schéma géré par init.sql : Hibernate vérifie au démarrage que le schéma correspond
# aux entités et refuse de démarrer en cas de divergence (filet de sécurité prod, #27).
spring.jpa.hibernate.ddl-auto=validate

# LLM par défaut en prod = le conteneur Ollama du réseau interne (docker-compose-prod.yml) :
# aucune donnée de forum ne sort vers un tiers. Un fournisseur externe (Groq sur le VPS,
# docker-compose-hetzner.yml) n'est utilisé que si LLM_BASE_URL le désigne explicitement.
app.mcp.llm.base-url=${LLM_BASE_URL:http://ollama:11434/v1}

logging.level.com.moodit.mcp_service=INFO
