name: Sécurité

# Analyses de sécurité automatisées. Les résultats CodeQL et Trivy remontent dans l'onglet
# Security → Code scanning du dépôt (gratuit pour un dépôt public).
#  - CodeQL  : analyse statique Java, TypeScript/JavaScript et des workflows eux-mêmes.
#  - gitleaks : secrets committés, sur TOUT l'historique (~15 s). Faux positifs connus : .gitleaksignore.
#  - Trivy   : CVE des images Docker construites (OS de base + JAR / node_modules embarqués).
on:
  pull_request:
  push:
    # deploiement : le code réellement en prod (main + le vocal, #42) est analysé à chaque fusion.
    branches: [main, deploiement]
  schedule:
    - cron: "17 6 * * 1"   # lundi matin : nouvelles CVE publiées sur du code qui n'a pas bougé

# Un seul run par PR : un nouveau push annule le run précédent, encore en cours. Le type
# d'évènement fait partie du groupe : le run planifié et un push sur main (même ref) ne
# s'annulent plus l'un l'autre. Sur main et deploiement, rien n'est annulé : chaque fusion est vérifiée.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # envoi des résultats à Code scanning
    strategy:
      fail-fast: false
      matrix:
        # build-mode none : analyse sans compiler (pas besoin de construire les 6 projets Gradle).
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: gitleaks — secrets dans l'historique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # tout l'historique : un secret retiré au commit suivant reste exposé

      # Image officielle épinglée par digest (pas l'action gitleaks-action, qui exige une licence
      # payante pour les dépôts d'organisation). --redact : le secret n'apparaît jamais dans le log.
      - name: Scanner l'historique
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --no-banner --redact --verbose --gitleaks-ignore-path /repo/.gitleaksignore

  # BLOQUANT (#114) : chaque action est épinglée par SHA complet, version en commentaire
  # (`uses: actions/checkout@<sha> # v7.0.1`). Une étiquette (`@v7`) peut être déplacée vers du
  # code inconnu, qui tournerait avec le jeton du dépôt. Dependabot met à jour SHA et commentaire.
  actions-pinned:
    name: Actions épinglées par SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuser les actions non épinglées
        run: |
          # Toute ligne `uses:` hors action locale (./…) et image docker:// doit viser un SHA de 40 caractères.
          bad=$(grep -rnE '^\s*-?\s*uses:' .github \
            | grep -vE 'uses:\s*["'"'"']?(\./|docker://)' \
            | grep -vE 'uses:\s*["'"'"']?[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Actions non épinglées par SHA (#114) :"
            echo "$bad"
            exit 1
          fi
          echo "Toutes les actions sont épinglées par SHA."

  # BLOQUANT sur les CVE CRITICAL qui ont un correctif publié (#112), sur les PR comme sur main :
  # une dépendance qui en introduit une est arrêtée avant la fusion. Les HIGH restent visibles
  # (rapport et Code scanning) sans bloquer : aujourd'hui, elles viennent toutes des images de
  # base (eclipse-temurin, nginx:alpine), hors de notre code.
  trivy:
    name: Trivy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, core-service, execution-service, frontend, gateway, mcp-service, permission-service]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image
        run: docker build -t moodit/${{ matrix.service }}:ci ${{ matrix.service }}

      # --ignore-unfixed : seules les CVE qui ont un correctif publié (donc actionnables).
      # 1er passage : SARIF pour Code scanning. 2e : tableau lisible dans le log, avec la base de
      # CVE déjà téléchargée (cache partagé via le volume trivy-cache).
      - name: Scanner l'image
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/out" "$TRIVY_IMAGE" "$@"; }
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            --format sarif --output /out/trivy.sarif moodit/${{ matrix.service }}:ci
          trivy image -q --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --skip-db-update \
            moodit/${{ matrix.service }}:ci

      # Seul passage bloquant : CRITICAL corrigeables uniquement.
      - name: Bloquer sur les CVE critiques
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image -q --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update \
            moodit/${{ matrix.service }}:ci

      # Publié même si l'étape bloquante échoue : le détail reste consultable dans Code scanning.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
