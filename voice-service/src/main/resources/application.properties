spring.application.name=voice-service
spring.config.import=optional:file:../.env[.properties]
# Profil actif repris de SPRING_PROFILES_ACTIVE (.env importe ou vraie variable d'env).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${VOICE_SERVICE_PORT:8086}

# ── Autorisation ──────────────────────────────────────────────────────────────
# URL interne du permission-service : re-verification can-join AVANT de signer le token
# (meme oui/non que le join WebSocket temps reel et que le chat texte du salon).
app.permission-service.url=http://${PERMISSION_SERVICE_HOST:localhost}:${PERMISSION_SERVICE_PORT:8084}

# ── Vocal / LiveKit ─────────────────────────────────────────────────────────────
# URL PUBLIQUE du SFU renvoyee au navigateur. Cle/secret d'API LiveKit : signent les
# JoinToken (HMAC). Fallbacks dev NON surs (a surcharger en prod, voir application-prod).
moodit.voice.livekit.url=${LIVEKIT_URL:ws://localhost:7880}
moodit.voice.livekit.api-key=${LIVEKIT_API_KEY:devkey}
moodit.voice.livekit.api-secret=${LIVEKIT_API_SECRET:dev-livekit-secret-change-me-32bytes-min}
# TTL du JoinToken : LiveKit le REVALIDE a chaque reconnexion/reprise, il doit donc couvrir la
# duree d'une session (6h = convention LiveKit). La securite vient du controle d'acces en amont.
moodit.voice.token-ttl-seconds=${VOICE_TOKEN_TTL:21600}

# ── Logs ──────────────────────────────────────────────────────────────────────
# Surcharges par profil dans application-{dev,prod}.properties (pattern Spring Boot).
logging.level.org.springframework.web=WARN
