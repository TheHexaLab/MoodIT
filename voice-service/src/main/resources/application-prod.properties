# Surcharges actives uniquement sous le profil prod (SPRING_PROFILES_ACTIVE=prod).
# En prod, PAS de fallback dev : les coordonnees LiveKit DOIVENT venir de l'environnement
# (fail-fast au demarrage si absentes). Le secret doit faire >= 32 octets (contrainte HS256).
moodit.voice.livekit.url=${LIVEKIT_URL}
moodit.voice.livekit.api-key=${LIVEKIT_API_KEY}
moodit.voice.livekit.api-secret=${LIVEKIT_API_SECRET}

logging.level.com.moodit.voice_service=INFO
